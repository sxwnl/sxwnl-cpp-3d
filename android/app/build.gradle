plugins {
    id "com.android.application"
}

def releaseVersion = providers.gradleProperty("versionName").getOrElse("1.3.1")
def releaseStoreFile = providers.gradleProperty("releaseStoreFile").orNull
def releaseStorePassword = providers.gradleProperty("releaseStorePassword").orNull
def releaseKeyAlias = providers.gradleProperty("releaseKeyAlias").orNull
def releaseKeyPassword = providers.gradleProperty("releaseKeyPassword").orNull
def releaseSigningProperties = [
    releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword
]
def hasReleaseSigning = releaseSigningProperties.every { it }

if (releaseSigningProperties.any { it } && !hasReleaseSigning) {
    throw new GradleException("Release signing requires store file, store password, key alias, and key password")
}

android {
    namespace "top.qaiu.sxwnl"
    compileSdk 35
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "top.qaiu.sxwnl"
        minSdk 26
        targetSdk 35
        versionCode 131
        versionName releaseVersion

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c++17"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.31.5"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir("generated/assets"))
    }

    packaging {
        jniLibs.useLegacyPackaging = true
    }
}

def syncResources = tasks.register("syncResources", Copy) {
    from("../../resources")
    into(layout.buildDirectory.dir("generated/assets/resources"))
}

tasks.named("preBuild").configure {
    dependsOn(syncResources)
}
