plugins {
    id "com.android.application"
}

def releaseVersion = providers.gradleProperty("versionName").getOrElse("1.1.0")

android {
    namespace "top.qaiu.sxwnl"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "top.qaiu.sxwnl"
        minSdk 26
        targetSdk 35
        versionCode 110
        versionName releaseVersion

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c++17"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir("generated/assets"))
    }

    packaging {
        jniLibs.useLegacyPackaging = true
    }
}

def syncResources = tasks.register("syncResources", Copy) {
    from("../../resources")
    into(layout.buildDirectory.dir("generated/assets/resources"))
}

tasks.named("preBuild").configure {
    dependsOn(syncResources)
}
