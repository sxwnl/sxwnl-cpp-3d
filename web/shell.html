<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0c14">
  <title>寿星天文历 · 3D</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0c14;
      color: #d5e4f5;
      font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    #status {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: radial-gradient(ellipse at center, #12192a 0%, #0a0c14 70%);
      transition: opacity 0.4s ease;
    }
    #status.hide { opacity: 0; }
    #status h1 {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      margin: 0 0 0.75rem;
    }
    #status p {
      margin: 0;
      font-size: 0.85rem;
      color: #7f93ad;
    }
    #progress {
      width: min(280px, 70vw);
      height: 3px;
      margin-top: 1.1rem;
      background: #1c2a40;
      border-radius: 2px;
      overflow: hidden;
    }
    #bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #6d4cff, #35d6de);
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">
    <h1>寿星天文历</h1>
    <p id="status-text">正在加载 WebAssembly…</p>
    <div id="progress"><div id="bar"></div></div>
  </div>
  <script>
    function pageDir() {
      const p = window.location.pathname;
      return p.endsWith('/') ? p : p.slice(0, p.lastIndexOf('/') + 1);
    }

    var statusEl = document.getElementById('status');
    var statusText = document.getElementById('status-text');
    var bar = document.getElementById('bar');

    var Module = {
      canvas: document.getElementById('canvas'),
      locateFile: function (path) { return pageDir() + path; },
      setStatus: function (text) {
        if (!text) {
          statusEl.classList.add('hide');
          setTimeout(function () { statusEl.style.display = 'none'; }, 400);
          return;
        }
        statusText.textContent = text;
      },
      monitorRunDependencies: function (left) {
        if (left === 0) return;
        statusText.textContent = '准备资源 (' + left + ')';
      },
      preRun: [function () {
        // Fonts must be in MEMFS before main(): ImFontAtlas::Build() cannot
        // wait. Textures stay out of this path so the wasm module itself
        // can start without the 100MB texture tree.
        var files = [
          ['resources/v1/fonts/NotoSansCJKsc-Regular.otf',
           '/resources/fonts/NotoSansCJKsc-Regular.otf'],
          ['resources/v1/fonts/NotoSansSymbols-Astro.ttf',
           '/resources/fonts/NotoSansSymbols-Astro.ttf']
        ];
        files.forEach(function (pair) {
          var url = pageDir() + pair[0];
          var path = pair[1];
          addRunDependency('font:' + path);
          fetch(url).then(function (r) {
            if (!r.ok) throw new Error(url + ' ' + r.status);
            return r.arrayBuffer();
          }).then(function (buf) {
            var dir = path.slice(0, path.lastIndexOf('/'));
            if (dir) FS.mkdirTree(dir);
            FS.writeFile(path, new Uint8Array(buf));
            removeRunDependency('font:' + path);
          }).catch(function (e) {
            console.error('[font]', e);
            removeRunDependency('font:' + path);
          });
        });
      }]
    };

    window.addEventListener('resize', function () {
      var c = Module.canvas;
      if (!c) return;
      var dpr = window.devicePixelRatio || 1;
      c.width = Math.max(1, Math.floor(window.innerWidth * dpr));
      c.height = Math.max(1, Math.floor(window.innerHeight * dpr));
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
